[package]
name = "hadris-apfs"
version = "2.0.0-rc.4"
description = "APFS container and filesystem reader for Hadris"
readme = "README.md"
keywords = ["apfs", "filesystem", "apple", "disk"]
categories = ["filesystem", "no-std"]
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["std", "read", "sync", "tree"]
std = ["alloc", "hadris-io/std", "hadris-storage/std"]
alloc = []
read = []
write = ["alloc", "read"]
sync = ["hadris-io/sync", "hadris-storage/sync"]
async = ["hadris-io/async", "hadris-storage/async"]
tree = ["read", "alloc"]
# Software (password/recovery-key) FileVault decryption: keybag parsing,
# PBKDF2 key derivation, RFC 3394 AES key-unwrap, and AES-XTS block
# decryption. Does not (and cannot) decrypt Secure-Enclave-sealed volumes,
# since their VEK is never unwrappable from on-disk bytes alone.
crypto = ["read", "alloc", "dep:aes", "dep:cipher", "dep:xts-mode", "dep:aes-kw", "dep:pbkdf2", "dep:sha2"]

[dependencies]
hadris-io.workspace = true
hadris-storage.workspace = true
hadris-common.workspace = true
bitflags.workspace = true
aes = { version = "0.9.1", optional = true, default-features = false }
xts-mode = { version = "0.6.0", optional = true }
aes-kw = { version = "0.3.1", optional = true, default-features = false }
pbkdf2 = { version = "0.13.0", optional = true, default-features = false, features = ["hmac"] }
sha2 = { version = "0.11.0", optional = true, default-features = false }
cipher = { version = "0.5.2", optional = true }
